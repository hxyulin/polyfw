name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

  pull_request:
    # The draft transition cancels an existing run through concurrency below.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          # Override the action's default deny: fixtures emit unused-dependency warnings.
          # The justfile's Clippy step still enforces -D warnings for our code.
          build-warnings: warn

      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: just@1.58.0

      - run: just check
